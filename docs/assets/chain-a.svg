<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="Segoe UI,Helvetica,Arial" font-size="13">
  <rect width="920" height="360" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="17" font-weight="600">Chain A — classroom WS → arbitrary write → install task → silent install</text>
  <g fill="#e6edf3">
    <rect x="24" y="60" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="82">1. classroom app connects WS</text>
    <text x="40" y="100" fill="#8b949e">plaintext :8889, no TLS</text>

    <rect x="252" y="60" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="268" y="82">2. inject one frame</text>
    <text x="268" y="100" fill="#8b949e">createTag=canvas_tag, type=0</text>

    <rect x="480" y="60" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="496" y="82">3. TaskDetail → DB</text>
    <text x="496" y="100" fill="#8b949e">insert + startDownLoadPptService</text>

    <rect x="708" y="60" width="188" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="724" y="82">4. resource download</text>
    <text x="724" y="100" fill="#8b949e">/api/v4/resource/single</text>

    <rect x="24" y="150" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="172">5. 7z traversal write</text>
    <text x="40" y="190" fill="#8b949e">libun7zip: no ".." filter</text>

    <rect x="252" y="150" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="268" y="172">6. replace launcher DB</text>
    <text x="268" y="190" fill="#8b949e">/sdcard/.../xh_launcher.db</text>

    <rect x="480" y="150" width="200" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="496" y="172">7. home self-update</text>
    <text x="496" y="190" fill="#8b949e">status != 0x65</text>

    <rect x="708" y="150" width="188" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="724" y="172">8. MDM install</text>
    <text x="724" y="190" fill="#8b949e">installApplication(path)</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.2" fill="none">
    <path d="M224 86 H248" marker-end="url(#a)"/><path d="M452 86 H476" marker-end="url(#a)"/>
    <path d="M680 86 H704" marker-end="url(#a)"/><path d="M802 112 V146" marker-end="url(#a)"/>
    <path d="M224 176 H248" marker-end="url(#a)"/><path d="M452 176 H476" marker-end="url(#a)"/>
    <path d="M680 176 H704" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8b949e"/></marker></defs>
  <text x="24" y="246" fill="#8b949e">Research preview: steps 1–4 verified at code level; device-side end-to-end is not yet complete (see docs/STATUS.md).</text>
  <text x="24" y="268" fill="#8b949e">Steps 5–8 are code-level closed but not yet validated on a device.</text>
</svg>
